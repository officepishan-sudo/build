# .structure-gate.conf - ברירות מחדל לפרויקט עבור scripts/structure-gate.sh (KEY=VALUE, bash)
# שינוי סף = DEC בתכנית עם נימוק. אפליקציה קיימת: --write-baseline .structure-baseline פעם אחת.
MAX_FILE=300
MAX_FUNCTION=50
MAX_COMPONENT=150
MAX_TEST_FILE=500
# איפה מותר לגשת ל-DB/ORM (globs מופרדים בפסיק)
DATA_LAYER="*/repository.ts,*.repository.ts,lib/db,lib/prisma.ts,prisma,tests,scripts,*/api/health,*/api/health/*,*/_lib/*"
# אפליקציה שטוחה (L0/L1, 2-3 מסכים, בלי features/): DB מותר בכל lib/ - אבל לא ב-app/:
# DATA_LAYER="lib,prisma,tests,scripts,*/api/health/*"
# תיקיות מקור (ריק = הכל מהשורש); EXCLUDE = מה לדלג
SRC_DIRS="app,features,components,hooks,lib,src"
EXCLUDE="node_modules,.next,dist,build,coverage,.git,.venv,__pycache__,migrations,generated,*.d.ts,*.config.*"
SIZE_MODE=strict   # סבב 10: strict = חריגה מהסף = כישלון (ברירת מחדל); soft = עד 2× הסף אזהרה, מעל 2× כישלון. הספים הם default הנדסי (ESLint), לא סטנדרט - core/sources-of-truth.md
